name: TV Migration Preview

on:
  push:
    branches:
      - feat/barbertrix-tv-pairing-kiosk
    paths:
      - .tv-migration-preview

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost;Database=BarberTrixMigration;User Id=sa;Password=PreviewOnly_123!;Encrypt=False"
      Jwt__Key: "tv-migration-preview-jwt-key-with-more-than-thirty-two-chars"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate and commit EF migration
        run: |
          dotnet restore BarberTurn.sln
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet ef migrations add BarberTrixTvDisplays --project backend/src/BarberTurn.Infrastructure --startup-project backend/src/BarberTurn.Api
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/BarberTurn.Infrastructure/Persistence/Migrations
          git commit -m "feat(tv): add EF Core display migration"
          git pull --rebase origin feat/barbertrix-tv-pairing-kiosk
          git push origin HEAD:feat/barbertrix-tv-pairing-kiosk
