name: Identity stage C bootstrap

on:
  push:
    branches:
      - feat/barber-independent-registration

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: BarberTurn_CI_2026!Secure
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    env:
      BARBERTURN_TEST_CONNECTION: "Server=localhost,1433;Database=BarberTurnStageCCi;User Id=sa;Password=BarberTurn_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=BarberTurnStageCCi;User Id=sa;Password=BarberTurn_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: "ci-only-jwt-key-with-more-than-thirty-two-characters-2026"
      EXPO_PUBLIC_API_BASE_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/barber-independent-registration
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Apply stage C changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/stage_c_bootstrap.py')
          text = path.read_text()
          old = ': this(barberShopId == Guid.Empty ? throw new ArgumentException("Barbershop is required.", nameof(barberShopId)) : barberShopId,'
          new = ': this(barberShopId == Guid.Empty ? throw new ArgumentException("Barbershop is required.", nameof(barberShopId)) : (Guid?)barberShopId,'
          if old not in text:
              raise SystemExit('Constructor delegation marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/stage_c_bootstrap.py

      - name: Generate EF migration
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version '10.*'
          dotnet restore BarberTurn.sln
          dotnet build BarberTurn.sln --configuration Release --no-restore
          dotnet ef migrations add IndependentBarberUsers \
            --project backend/src/BarberTurn.Infrastructure/BarberTurn.Infrastructure.csproj \
            --startup-project backend/src/BarberTurn.Infrastructure/BarberTurn.Infrastructure.csproj \
            --context ApplicationDbContext \
            --output-dir Persistence/Migrations \
            --configuration Release \
            --no-build

      - name: Validate stage C
        shell: bash
        run: |
          dotnet test backend/tests/BarberTurn.Api.Tests/BarberTurn.Api.Tests.csproj --configuration Release --no-build --no-restore
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm ci --prefix mobile
          npm run typecheck --prefix mobile

      - name: Commit stage C
        shell: bash
        run: |
          rm .github/workflows/identity-stage-c-audit.yml
          rm .github/workflows/identity-stage-c-bootstrap.yml
          rm .github/scripts/stage_c_bootstrap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support independent barber registration'
          git push origin HEAD:feat/barber-independent-registration
