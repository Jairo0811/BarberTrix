name: TV Migration Preview

on:
  push:
    branches:
      - feat/barbertrix-tv-pairing-kiosk
    paths:
      - .tv-migration-preview

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost;Database=BarberTrixMigration;User Id=sa;Password=PreviewOnly_123!;Encrypt=False"
      Jwt__Key: "tv-migration-preview-jwt-key-with-more-than-thirty-two-chars"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate migration preview
        run: |
          dotnet restore BarberTurn.sln
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet ef migrations add BarberTrixTvDisplays --project backend/src/BarberTurn.Infrastructure --startup-project backend/src/BarberTurn.Api
          git status --short
      - name: Export generated EF files
        uses: actions/upload-artifact@v4
        with:
          name: barbertrix-tv-ef-migration
          path: |
            backend/src/BarberTurn.Infrastructure/Persistence/Migrations/*BarberTrixTvDisplays*.cs
            backend/src/BarberTurn.Infrastructure/Persistence/Migrations/ApplicationDbContextModelSnapshot.cs
          if-no-files-found: error
          retention-days: 1
