name: Stage D invitation finish

on:
  push:
    branches:
      - feat/barber-onboarding-membership
    paths:
      - .github/scripts/stage_d_invitation_finish.py
      - .github/scripts/stage_d_invitation_test_fix.py
      - .github/workflows/stage-d-invitation-finish.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: BarberTurn_CI_2026!Secure
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    env:
      BARBERTURN_TEST_CONNECTION: Server=localhost,1433;Database=BarberTurnStageDInviteCi;User Id=sa;Password=BarberTurn_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=BarberTurnStageDInviteCi;User Id=sa;Password=BarberTurn_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True
      Jwt__Key: ci-only-jwt-key-with-more-than-thirty-two-characters-2026
      Database__ApplyMigrations: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/barber-onboarding-membership
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply final Stage D patch
        run: |
          python3 .github/scripts/stage_d_invitation_finish.py
          python3 .github/scripts/stage_d_invitation_test_fix.py
      - name: Validate backend
        run: |
          dotnet build backend/src/BarberTurn.Api/BarberTurn.Api.csproj -c Release --nologo
          dotnet test backend/tests/BarberTurn.Api.Tests/BarberTurn.Api.Tests.csproj -c Release --nologo
      - name: Commit final Stage D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete existing barber invitation onboarding"
          git push origin HEAD:feat/barber-onboarding-membership
