name: PR93 Repair

on:
  push:
    branches: [feature/mobile-customer-auth-social]
    paths:
      - ".github/workflows/pr93-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-customer-auth-social
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean mobile install
        working-directory: mobile
        run: npm ci

      - name: Configure ShopLocation EF mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/BarberTrix.Infrastructure/Persistence/ApplicationDbContext.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            entity.Property(x => x.Address).HasMaxLength(300);\n            entity.Property(x => x.TimeZoneId).HasMaxLength(100).IsRequired();\n            entity.HasIndex(x => new { x.BarberShopId, x.Slug }).IsUnique();\n            entity.HasIndex(x => new { x.BarberShopId, x.IsActive });'''
          new = '''            entity.Property(x => x.Address).HasMaxLength(300);\n            entity.Property(x => x.City).HasMaxLength(120);\n            entity.Property(x => x.Neighborhood).HasMaxLength(120);\n            entity.Property(x => x.Reference).HasMaxLength(300);\n            entity.Property(x => x.Latitude).HasPrecision(9, 6);\n            entity.Property(x => x.Longitude).HasPrecision(9, 6);\n            entity.Property(x => x.TimeZoneId).HasMaxLength(100).IsRequired();\n            entity.HasIndex(x => new { x.BarberShopId, x.Slug }).IsUnique();\n            entity.HasIndex(x => new { x.BarberShopId, x.IsActive });\n            entity.HasIndex(x => new { x.Latitude, x.Longitude });'''
          if old not in text:
              raise SystemExit('Expected ShopLocation mapping block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Regenerate ShopLocation migration
        run: |
          rm backend/src/BarberTrix.Infrastructure/Persistence/Migrations/20260904014500_ShopLocationGeoProfile.cs
          dotnet restore BarberTrix.sln
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet ef migrations add ShopLocationGeoProfile \
            --project backend/src/BarberTrix.Infrastructure \
            --startup-project backend/src/BarberTrix.Api
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/BarberTrix.Infrastructure \
            --startup-project backend/src/BarberTrix.Api

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json \
            backend/src/BarberTrix.Infrastructure/Persistence/ApplicationDbContext.cs \
            backend/src/BarberTrix.Infrastructure/Persistence/Migrations
          git commit -m "fix: synchronize mobile dependencies and EF migration"
          git push origin HEAD:feature/mobile-customer-auth-social
