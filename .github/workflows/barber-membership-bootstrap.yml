name: Barber membership persistence bootstrap

on:
  push:
    branches:
      - feat/barber-membership-persistence

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/barber-membership-persistence
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply persistence and dual-write changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          db_path = Path('backend/src/BarberTurn.Infrastructure/Persistence/ApplicationDbContext.cs')
          text = db_path.read_text()
          text = text.replace(
              '    public DbSet<User> Users => Set<User>();\n',
              '    public DbSet<User> Users => Set<User>();\n    public DbSet<BarberProfile> BarberProfiles => Set<BarberProfile>();\n    public DbSet<ShopMembership> ShopMemberships => Set<ShopMembership>();\n',
              1)

          marker = '''        modelBuilder.Entity<Barber>(entity =>\n        {'''
          mapping = '''        modelBuilder.Entity<BarberProfile>(entity =>\n        {\n            entity.ToTable("BarberProfiles");\n            entity.HasKey(x => x.Id);\n            entity.Property(x => x.DisplayName).HasMaxLength(120).IsRequired();\n            entity.Property(x => x.Bio).HasMaxLength(1000);\n            entity.HasIndex(x => x.UserId).IsUnique();\n            entity.HasOne<User>().WithMany().HasForeignKey(x => x.UserId).OnDelete(DeleteBehavior.Cascade);\n        });\n\n        modelBuilder.Entity<ShopMembership>(entity =>\n        {\n            entity.ToTable("ShopMemberships", table => table.HasCheckConstraint(\n                "CK_ShopMemberships_BarberLink",\n                "([Role] = 'Barber' AND [BarberId] IS NOT NULL) OR ([Role] <> 'Barber' AND [BarberId] IS NULL)"));\n            entity.HasKey(x => x.Id);\n            entity.Property(x => x.Role).HasConversion<string>().HasMaxLength(40).IsRequired();\n            entity.Property(x => x.Status).HasConversion<string>().HasMaxLength(30).IsRequired();\n            entity.HasIndex(x => new { x.UserId, x.BarberShopId }).IsUnique();\n            entity.HasIndex(x => new { x.BarberShopId, x.Status, x.Role });\n            entity.HasOne<User>().WithMany().HasForeignKey(x => x.UserId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<BarberShop>().WithMany().HasForeignKey(x => x.BarberShopId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<Barber>().WithMany().HasForeignKey(x => x.BarberId).OnDelete(DeleteBehavior.Restrict);\n        });\n\n'''
          if marker not in text:
              raise SystemExit('Barber mapping marker not found')
          text = text.replace(marker, mapping + marker, 1)
          db_path.write_text(text)

          auth_path = Path('backend/src/BarberTurn.Infrastructure/Auth/AuthService.cs')
          text = auth_path.read_text()
          text = text.replace(
              '        dbContext.Users.Add(user);\n        await dbContext.SaveChangesAsync(cancellationToken);',
              '        dbContext.Users.Add(user);\n        dbContext.ShopMemberships.Add(new ShopMembership(user.Id, barberShop.Id, UserRole.Owner));\n        await dbContext.SaveChangesAsync(cancellationToken);',
              1)
          text = text.replace(
              '        dbContext.Users.Add(user);\n\n        var barberOne = new Barber(shop.Id, "Carlos", 1);',
              '        dbContext.Users.Add(user);\n        dbContext.ShopMemberships.Add(new ShopMembership(user.Id, shop.Id, UserRole.Owner));\n\n        var barberOne = new Barber(shop.Id, "Carlos", 1);',
              1)
          old_accept = '''        invitation.Accept();\n        dbContext.Users.Add(user);\n        await dbContext.SaveChangesAsync(cancellationToken);'''
          new_accept = '''        invitation.Accept();\n        dbContext.Users.Add(user);\n        dbContext.ShopMemberships.Add(new ShopMembership(user.Id, invitation.BarberShopId, invitation.Role, invitation.BarberId));\n        if (invitation.Role == UserRole.Barber)\n            dbContext.BarberProfiles.Add(new BarberProfile(user.Id, user.Name));\n        await dbContext.SaveChangesAsync(cancellationToken);'''
          if old_accept not in text:
              raise SystemExit('Invitation acceptance marker not found')
          text = text.replace(old_accept, new_accept, 1)
          old_deactivate = '''        user.Deactivate();\n        var sessions = await dbContext.RefreshSessions.Where(x => x.UserId == user.Id && x.RevokedAtUtc == null).ToListAsync(cancellationToken);'''
          new_deactivate = '''        user.Deactivate();\n        var membership = await dbContext.ShopMemberships.SingleOrDefaultAsync(\n            x => x.UserId == user.Id && x.BarberShopId == barberShopId,\n            cancellationToken);\n        membership?.Revoke();\n        var sessions = await dbContext.RefreshSessions.Where(x => x.UserId == user.Id && x.RevokedAtUtc == null).ToListAsync(cancellationToken);'''
          if old_deactivate not in text:
              raise SystemExit('Deactivate marker not found')
          text = text.replace(old_deactivate, new_deactivate, 1)
          auth_path.write_text(text)

          seed_path = Path('backend/src/BarberTurn.Infrastructure/Persistence/DevelopmentDataSeeder.cs')
          text = seed_path.read_text()
          old_existing = '''            var existingShop = await dbContext.BarberShops.SingleAsync(x => x.Id == existingUser.BarberShopId, cancellationToken);\n            existingShop.ChangeSubscription(SubscriptionPlan.Business, SubscriptionStatus.Active);\n\n            await dbContext.SaveChangesAsync(cancellationToken);'''
          new_existing = '''            var existingShop = await dbContext.BarberShops.SingleAsync(x => x.Id == existingUser.BarberShopId, cancellationToken);\n            existingShop.ChangeSubscription(SubscriptionPlan.Business, SubscriptionStatus.Active);\n\n            if (!await dbContext.ShopMemberships.AnyAsync(\n                    x => x.UserId == existingUser.Id && x.BarberShopId == existingUser.BarberShopId,\n                    cancellationToken))\n            {\n                dbContext.ShopMemberships.Add(new ShopMembership(\n                    existingUser.Id,\n                    existingUser.BarberShopId,\n                    UserRole.Administrator));\n            }\n\n            await dbContext.SaveChangesAsync(cancellationToken);'''
          if old_existing not in text:
              raise SystemExit('Existing seed marker not found')
          text = text.replace(old_existing, new_existing, 1)
          text = text.replace(
              '        dbContext.Users.Add(seededUser);\n        await dbContext.SaveChangesAsync(cancellationToken);',
              '        dbContext.Users.Add(seededUser);\n        dbContext.ShopMemberships.Add(new ShopMembership(seededUser.Id, barberShop.Id, UserRole.Administrator));\n        await dbContext.SaveChangesAsync(cancellationToken);',
              1)
          seed_path.write_text(text)
          PY

      - name: Generate EF Core migration
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version '10.*'
          dotnet restore BarberTurn.sln
          dotnet ef migrations add BarberIdentityMemberships \
            --project backend/src/BarberTurn.Infrastructure/BarberTurn.Infrastructure.csproj \
            --startup-project backend/src/BarberTurn.Infrastructure/BarberTurn.Infrastructure.csproj \
            --context ApplicationDbContext \
            --output-dir Persistence/Migrations

      - name: Add migration backfill
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          migration = next(Path('backend/src/BarberTurn.Infrastructure/Persistence/Migrations').glob('*_BarberIdentityMemberships.cs'))
          text = migration.read_text()
          marker = '''        }\n\n        /// <inheritdoc />\n        protected override void Down(MigrationBuilder migrationBuilder)'''
          sql = '''\n            migrationBuilder.Sql(\"\"\"\n                IF EXISTS (SELECT 1 FROM [Users] WHERE [Role] = 'Barber' AND [BarberId] IS NULL)\n                    THROW 51000, 'Cannot backfill barber memberships because at least one barber user has no BarberId.', 1;\n\n                INSERT INTO [ShopMemberships] ([Id], [CreatedAtUtc], [UpdatedAtUtc], [UserId], [BarberShopId], [Role], [BarberId], [Status], [EndedAtUtc])\n                SELECT NEWID(), u.[CreatedAtUtc], u.[UpdatedAtUtc], u.[Id], u.[BarberShopId], u.[Role],\n                       CASE WHEN u.[Role] = 'Barber' THEN u.[BarberId] ELSE NULL END,\n                       CASE WHEN u.[IsActive] = 1 THEN 'Active' ELSE 'Revoked' END,\n                       CASE WHEN u.[IsActive] = 1 THEN NULL ELSE SYSUTCDATETIME() END\n                FROM [Users] u\n                WHERE NOT EXISTS (\n                    SELECT 1 FROM [ShopMemberships] m\n                    WHERE m.[UserId] = u.[Id] AND m.[BarberShopId] = u.[BarberShopId]);\n\n                INSERT INTO [BarberProfiles] ([Id], [CreatedAtUtc], [UpdatedAtUtc], [UserId], [DisplayName], [Bio], [IsAvailableForWork])\n                SELECT NEWID(), u.[CreatedAtUtc], u.[UpdatedAtUtc], u.[Id], u.[Name], NULL, CAST(0 AS bit)\n                FROM [Users] u\n                WHERE u.[Role] = 'Barber'\n                  AND NOT EXISTS (SELECT 1 FROM [BarberProfiles] p WHERE p.[UserId] = u.[Id]);\n                \"\"\");\n'''
          if marker not in text:
              raise SystemExit(f'Migration Up/Down marker not found in {migration}')
          text = text.replace(marker, sql + marker, 1)
          migration.write_text(text)
          PY

      - name: Validate backend
        run: |
          dotnet build BarberTurn.sln --configuration Release --no-restore
          dotnet test backend/tests/BarberTurn.Domain.Tests/BarberTurn.Domain.Tests.csproj --configuration Release --no-build

      - name: Commit generated persistence changes
        shell: bash
        run: |
          rm .github/workflows/barber-membership-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/BarberTurn.Infrastructure/Persistence/ApplicationDbContext.cs \
                  backend/src/BarberTurn.Infrastructure/Persistence/DevelopmentDataSeeder.cs \
                  backend/src/BarberTurn.Infrastructure/Auth/AuthService.cs \
                  backend/src/BarberTurn.Infrastructure/Persistence/Migrations \
                  .github/workflows/barber-membership-bootstrap.yml
          git commit -m 'feat: persist barber profiles and shop memberships'
          git push origin HEAD:feat/barber-membership-persistence
