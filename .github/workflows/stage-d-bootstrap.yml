name: Stage D bootstrap

on:
  push:
    branches:
      - feat/barber-onboarding-membership
    paths:
      - .github/scripts/stage_d_bootstrap.py
      - .github/workflows/stage-d-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: BarberTurn_CI_2026!Secure
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    env:
      BARBERTURN_TEST_CONNECTION: Server=localhost,1433;Database=BarberTurnStageDCi;User Id=sa;Password=BarberTurn_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=BarberTurnStageDCi;User Id=sa;Password=BarberTurn_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True
      Jwt__Key: ci-only-jwt-key-with-more-than-thirty-two-characters-2026
      Database__ApplyMigrations: 'true'
      EXPO_PUBLIC_API_BASE_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/barber-onboarding-membership
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Apply Stage D changes
        run: |
          python3 .github/scripts/stage_d_bootstrap.py
          python3 .github/scripts/stage_d_validation_fix.py
      - name: Restore backend
        run: dotnet restore backend/src/BarberTurn.Api/BarberTurn.Api.csproj
      - name: Generate EF migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations add BarberJoinRequests \
            --project backend/src/BarberTurn.Infrastructure/BarberTurn.Infrastructure.csproj \
            --startup-project backend/src/BarberTurn.Api/BarberTurn.Api.csproj \
            --output-dir Persistence/Migrations
      - name: Validate backend
        run: |
          dotnet build backend/src/BarberTurn.Api/BarberTurn.Api.csproj -c Release --nologo
          dotnet test backend/tests/BarberTurn.Api.Tests/BarberTurn.Api.Tests.csproj -c Release --nologo
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Validate mobile
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit Stage D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add barber shop onboarding flow"
          git push origin HEAD:feat/barber-onboarding-membership
