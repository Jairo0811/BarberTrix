name: Repair Expo SDK 57 lockfile (one-time)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mobile-expo-lockfile-repair.yml

permissions:
  contents: write

jobs:
  align-expo:
    # Prevent running this write-enabled job from forks or unrelated pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/forms-audit-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the controlled head branch
        uses: actions/checkout@v4
        with:
          ref: fix/forms-audit-20261105
          fetch-depth: 1
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Rebuild the Expo SDK 57-compatible dependency lockfile
        working-directory: mobile
        run: |
          npm ci
          npx expo install --fix
          npx expo install --check
          npm run typecheck
          npm run i18n:check
          npm test
          npm ci
          npx expo install --check
      - name: Commit validated mobile manifests only
        run: |
          git diff --check
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Expo manifest and lockfile were already aligned"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mobile): synchronize Expo SDK 57 package versions and npm lockfile'
          git push origin HEAD:fix/forms-audit-20261105
