name: Generate frontend lockfile

on:
  push:
    branches: [test/frontend-playwright]
    paths:
      - frontend/package.json
      - .github/workflows/generate-frontend-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/frontend-playwright
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "test(frontend): synchronize Playwright lock"
          git push origin HEAD:test/frontend-playwright
