name: TV Phase 1 Bootstrap

on:
  push:
    branches: [feat/barbertrix-tv-pairing-kiosk]
    paths: [.tv-phase1-bootstrap]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost;Database=BarberTrixMigration;User Id=sa;Password=NotUsed_OnlyDesignTime_123!;Encrypt=False"
      Jwt__Key: "tv-phase1-bootstrap-jwt-key-with-more-than-thirty-two-chars"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/barbertrix-tv-pairing-kiosk
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Integrate TV persistence, DI, API and realtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'backend/src/BarberTurn.Infrastructure/Persistence/ApplicationDbContext.cs',
              '    public DbSet<ShopLocation> ShopLocations => Set<ShopLocation>();\n',
              '    public DbSet<ShopLocation> ShopLocations => Set<ShopLocation>();\n    public DbSet<TvDisplay> TvDisplays => Set<TvDisplay>();\n')

          replace_once(
              'backend/src/BarberTurn.Infrastructure/Persistence/ApplicationDbContext.cs',
              '        modelBuilder.Entity<Subscription>(entity =>\n        {\n            entity.ToTable("Subscriptions");',
              '''        modelBuilder.Entity<TvDisplay>(entity =>
        {
            entity.ToTable("TvDisplays");
            entity.HasKey(x => x.Id);
            entity.Property(x => x.Name).HasMaxLength(120).IsRequired();
            entity.Property(x => x.PairingCodeHash).HasMaxLength(64);
            entity.Property(x => x.DisplayTokenHash).HasMaxLength(64);
            entity.HasIndex(x => x.PairingCodeHash).IsUnique().HasFilter("[PairingCodeHash] IS NOT NULL");
            entity.HasIndex(x => x.DisplayTokenHash).IsUnique().HasFilter("[DisplayTokenHash] IS NOT NULL");
            entity.HasIndex(x => new { x.BarberShopId, x.IsActive });
            entity.HasOne<BarberShop>().WithMany().HasForeignKey(x => x.BarberShopId).OnDelete(DeleteBehavior.Cascade);
        });

        modelBuilder.Entity<Subscription>(entity =>
        {
            entity.ToTable("Subscriptions");''')

          replace_once(
              'backend/src/BarberTurn.Infrastructure/DependencyInjection.cs',
              'using BarberTurn.Application.TurnRequests;\n',
              'using BarberTurn.Application.TurnRequests;\nusing BarberTurn.Application.Tv;\n')
          replace_once(
              'backend/src/BarberTurn.Infrastructure/DependencyInjection.cs',
              'using BarberTurn.Infrastructure.TurnRequests;\n',
              'using BarberTurn.Infrastructure.TurnRequests;\nusing BarberTurn.Infrastructure.Tv;\n')
          replace_once(
              'backend/src/BarberTurn.Infrastructure/DependencyInjection.cs',
              '        services.AddScoped<IShopLookupService, ShopLookupService>();\n',
              '        services.AddScoped<IShopLookupService, ShopLookupService>();\n        services.AddScoped<ITvDisplayService, TvDisplayService>();\n')

          replace_once(
              'backend/src/BarberTurn.Api/Program.cs',
              '    options.AddPolicy("publicQueue", context => RateLimitPartition.GetFixedWindowLimiter(context.Connection.RemoteIpAddress?.ToString() ?? "unknown", _ => new FixedWindowRateLimiterOptions { PermitLimit = isTesting ? 1000 : 60, Window = TimeSpan.FromMinutes(1), QueueLimit = 0 }));\n',
              '    options.AddPolicy("publicQueue", context => RateLimitPartition.GetFixedWindowLimiter(context.Connection.RemoteIpAddress?.ToString() ?? "unknown", _ => new FixedWindowRateLimiterOptions { PermitLimit = isTesting ? 1000 : 60, Window = TimeSpan.FromMinutes(1), QueueLimit = 0 }));\n    options.AddPolicy("tvPairing", context => RateLimitPartition.GetFixedWindowLimiter(context.Connection.RemoteIpAddress?.ToString() ?? "unknown", _ => new FixedWindowRateLimiterOptions { PermitLimit = isTesting ? 1000 : 12, Window = TimeSpan.FromMinutes(1), QueueLimit = 0 }));\n')
          replace_once(
              'backend/src/BarberTurn.Api/Program.cs',
              'app.MapPushEndpoints();\napp.MapCommercialEndpoints();\n',
              'app.MapPushEndpoints();\napp.MapTvEndpoints();\napp.MapCommercialEndpoints();\n')

          Path('backend/src/BarberTurn.Api/Realtime/QueueHub.cs').write_text('''using BarberTurn.Application.Common;
using BarberTurn.Application.Tv;
using BarberTurn.Infrastructure.Persistence;
using Microsoft.AspNetCore.SignalR;
using Microsoft.EntityFrameworkCore;

namespace BarberTurn.Api.Realtime;

public sealed class QueueHub(ApplicationDbContext dbContext, ITvDisplayService tvDisplayService) : Hub
{
    public override async Task OnConnectedAsync()
    {
        if (Guid.TryParse(Context.User?.FindFirst("barbershop_id")?.Value, out var shopId))
            await Groups.AddToGroupAsync(Context.ConnectionId, InternalGroup(shopId));
        await base.OnConnectedAsync();
    }

    public Task<bool> JoinPublicShop(string slug) => JoinBySlugAsync(slug, PublicGroup);

    public async Task<bool> JoinTvDisplay(string displayToken)
    {
        var session = await tvDisplayService.ResolveSessionAsync(displayToken, Context.ConnectionAborted);
        if (session is null)
            return false;
        await Groups.AddToGroupAsync(Context.ConnectionId, TvGroup(session.BarberShopId));
        return true;
    }

    private async Task<bool> JoinBySlugAsync(string slug, Func<Guid, string> groupFactory)
    {
        var normalizedSlug = slug.Trim().ToLowerInvariant();
        var shopId = await dbContext.BarberShops.AsNoTracking()
            .Where(x => x.Slug == normalizedSlug && x.IsActive)
            .Select(x => (Guid?)x.Id)
            .SingleOrDefaultAsync();
        if (shopId is null)
            return false;
        await Groups.AddToGroupAsync(Context.ConnectionId, groupFactory(shopId.Value));
        return true;
    }

    internal static string InternalGroup(Guid shopId) => $"shop:{shopId:N}:internal";
    internal static string PublicGroup(Guid shopId) => $"shop:{shopId:N}:public";
    internal static string TvGroup(Guid shopId) => $"shop:{shopId:N}:tv";
}

public sealed class SignalRQueueNotifier(IHubContext<QueueHub> hubContext) : IQueueNotifier
{
    public Task QueueChangedAsync(Guid barberShopId, string eventName, CancellationToken cancellationToken = default)
    {
        var payload = new { eventName, occurredAtUtc = DateTimeOffset.UtcNow };
        return Task.WhenAll(
            hubContext.Clients.Group(QueueHub.InternalGroup(barberShopId)).SendAsync("queueChanged", payload, cancellationToken),
            hubContext.Clients.Group(QueueHub.PublicGroup(barberShopId)).SendAsync("queueChanged", payload, cancellationToken),
            hubContext.Clients.Group(QueueHub.TvGroup(barberShopId)).SendAsync("queueChanged", payload, cancellationToken));
    }
}
''')
          PY
      - name: Restore and generate EF Core migration
        run: |
          dotnet restore BarberTurn.sln
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet ef migrations add BarberTrixTvDisplays --project backend/src/BarberTurn.Infrastructure --startup-project backend/src/BarberTurn.Api
          dotnet build BarberTurn.sln --configuration Release
      - name: Commit generated integration
        run: |
          rm -f .tv-phase1-bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .tv-phase1-bootstrap
          git commit -m "feat(tv): integrate secure display persistence"
          git push origin HEAD:feat/barbertrix-tv-pairing-kiosk
