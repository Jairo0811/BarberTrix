name: Identity stage C bootstrap

on:
  push:
    branches:
      - feat/barber-independent-registration

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/barber-independent-registration
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply stage C changes
        run: python3 .github/scripts/stage_c_bootstrap.py

      - name: Generate EF migration
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version '10.*'
          dotnet restore BarberTurn.sln
          dotnet build BarberTurn.sln --configuration Release --no-restore
          dotnet ef migrations add IndependentBarberUsers \
            --project backend/src/BarberTurn.Infrastructure/BarberTurn.Infrastructure.csproj \
            --startup-project backend/src/BarberTurn.Infrastructure/BarberTurn.Infrastructure.csproj \
            --context ApplicationDbContext \
            --output-dir Persistence/Migrations \
            --no-build

      - name: Validate stage C
        shell: bash
        run: |
          dotnet test backend/tests/BarberTurn.Api.Tests/BarberTurn.Api.Tests.csproj --configuration Release --no-build
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm ci --prefix mobile
          npm run typecheck --prefix mobile

      - name: Commit stage C
        shell: bash
        run: |
          rm .github/workflows/identity-stage-c-audit.yml
          rm .github/workflows/identity-stage-c-bootstrap.yml
          rm .github/scripts/stage_c_bootstrap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support independent barber registration'
          git push origin HEAD:feat/barber-independent-registration
