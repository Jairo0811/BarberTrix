name: Temporary Expo SDK 57 lockfile refresh

on:
  push:
    branches:
      - claude-pending-6-8-20261017

jobs:
  resolve:
    if: github.repository == 'Jairo0811/BarberTrix'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Regenerate Expo-compatible manifests without a write token
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npx expo install --fix
          npx expo install --check
          npm run typecheck
          npm run i18n:check
          npm test
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.test
      - uses: actions/upload-artifact@v4
        with:
          name: expo57-aligned-manifests
          path: |
            mobile/package.json
            mobile/package-lock.json
          if-no-files-found: error

  commit:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude-pending-6-8-20261017
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: expo57-aligned-manifests
          path: mobile
      - name: Commit only regenerated manifests (no dependency scripts or tokens shared)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Manifests already aligned"
            exit 0
          fi
          git commit -m "chore(mobile): refresh Expo SDK 57 patch compatibility"
          git push origin HEAD:claude-pending-6-8-20261017
