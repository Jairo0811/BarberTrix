name: Mobile Expo Align

on:
  push:
    branches: [feature/mobile-customer-auth-social]
    paths:
      - ".github/workflows/mobile-expo-align.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-customer-auth-social
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Align Expo packages
        working-directory: mobile
        run: npm install "expo@~57.0.20" "expo-notifications@~57.0.17" "expo-router@~57.0.19"
      - name: Verify clean install and dependency policy
        working-directory: mobile
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npx expo install --check
      - name: Typecheck
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.test
        run: npm run typecheck
      - name: Commit aligned dependencies
        run: |
          git rm .github/workflows/mobile-expo-align.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "fix(mobile): align Expo SDK 57 packages"
          git push origin HEAD:feature/mobile-customer-auth-social
