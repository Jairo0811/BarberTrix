name: Generate EF snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BarberTurn.sln
      - run: dotnet tool install --global dotnet-ef --version "10.0.*"
      - name: Generate snapshot
        run: dotnet ef migrations add SnapshotBootstrap --project backend/src/BarberTurn.Infrastructure --startup-project backend/src/BarberTurn.Api --output-dir Persistence/Migrations/SnapshotBootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: ef-snapshot
          path: backend/src/BarberTurn.Infrastructure/Persistence/Migrations/SnapshotBootstrap
