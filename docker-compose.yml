services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${BARBERTRIX_DB_PASSWORD:?Set BARBERTRIX_DB_PASSWORD in .env}
    ports:
      - "${BARBERTRIX_DB_PORT:-14330}:1433"
    volumes:
      - barbertrix-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BarberTrixDb;User Id=sa;Password=${BARBERTRIX_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: BarberTrix.Api
      Jwt__Audience: BarberTrix.Web
      Jwt__Key: ${BARBERTRIX_JWT_KEY:?Set BARBERTRIX_JWT_KEY in .env}
      Database__ApplyMigrations: "true"
      Demo__Enabled: "true"
      SystemAdmin__Enabled: "true"
      SystemAdmin__Email: admin@barbertrix.com.do
      SystemAdmin__Password: ${BARBERTRIX_DEMO_PASSWORD:?Set BARBERTRIX_DEMO_PASSWORD in .env}
      ShopMedia__RootPath: /app/data/shop-media
      ExternalAuth__PublicBaseUrl: ${BARBERTRIX_EXTERNAL_AUTH_PUBLIC_BASE_URL:-}
      ExternalAuth__Google__ClientId: ${BARBERTRIX_GOOGLE_CLIENT_ID:-}
      ExternalAuth__Google__ClientIds: ${BARBERTRIX_GOOGLE_CLIENT_ID:-}
      ExternalAuth__Google__ClientSecret: ${BARBERTRIX_GOOGLE_CLIENT_SECRET:-}
      ExternalAuth__Apple__ClientId: ${BARBERTRIX_APPLE_CLIENT_ID:-}
      ExternalAuth__Apple__ClientIds: ${BARBERTRIX_APPLE_CLIENT_ID:-}
      ExternalAuth__Apple__TeamId: ${BARBERTRIX_APPLE_TEAM_ID:-}
      ExternalAuth__Apple__KeyId: ${BARBERTRIX_APPLE_KEY_ID:-}
      ExternalAuth__Apple__PrivateKey: ${BARBERTRIX_APPLE_PRIVATE_KEY:-}
      PasswordReset__FrontendBaseUrl: http://localhost:8081
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:8081
    volumes:
      - barbertrix-shop-media:/app/data/shop-media
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  barbertrix-sqlserver:
  barbertrix-shop-media:
