name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: BarberTrix_CI_2026!Secure
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    env:
      BARBERTRIX_TEST_CONNECTION: "Server=localhost,1433;Database=BarberTrixCi;User Id=sa;Password=BarberTrix_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=BarberTrixCi;User Id=sa;Password=BarberTrix_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: "ci-only-jwt-key-with-more-than-thirty-two-characters-2026"
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BarberTrix.sln
      - name: Audit .NET dependencies
        run: dotnet list BarberTrix.sln package --vulnerable --include-transitive
      - name: Build
        run: dotnet build BarberTrix.sln --configuration Release --no-restore
      - name: Test with coverage
        run: dotnet test BarberTrix.sln --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory backend/TestResults
      - name: Validate critical backend coverage
        run: python3 backend/scripts/check_coverage.py --reports backend/TestResults --assembly BarberTrix.Domain --class-name BarberTrix.Domain.Entities.Turn --minimum 70
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/TestResults
          if-no-files-found: error
          retention-days: 14
      - name: Validate migration script
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet ef migrations has-pending-model-changes --project backend/src/BarberTrix.Infrastructure --startup-project backend/src/BarberTrix.Api --no-build --configuration Release
          dotnet ef migrations script --idempotent --project backend/src/BarberTrix.Infrastructure --startup-project backend/src/BarberTrix.Api --no-build --configuration Release --output migration.sql

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 14
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (critical gate)
        run: npm audit --omit=dev --audit-level=critical
      - name: Report high production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Expo dependency alignment
        run: npx expo install --check
      - name: Typecheck
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.test
        run: npm run typecheck
      - name: Check Mobile translation keys
        run: npm run i18n:check
      - name: Test mobile reliability
        run: npm test
      - name: Bundle Android
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.test
        run: npx expo export --platform android --output-dir dist-android
      - name: Bundle iOS
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.test
        run: npx expo export --platform ios --output-dir dist-ios

  frontend-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  fullstack-e2e:
    name: Full-stack E2E (React + API + SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: BarberTrix_CI_2026!Secure
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    env:
      BARBERTRIX_FULLSTACK_CONNECTION: "Server=localhost,1433;Database=BarberTrixFullstackCi;User Id=sa;Password=BarberTrix_CI_2026!Secure;Encrypt=True;TrustServerCertificate=True"
      BARBERTRIX_FULLSTACK_JWT_KEY: "ci-only-fullstack-jwt-key-with-more-than-thirty-two-characters-2026"
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore backend
        run: dotnet restore BarberTrix.sln
      - name: Build backend
        run: dotnet build BarberTrix.sln --configuration Release --no-restore
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real full-stack E2E
        working-directory: frontend
        run: npm run e2e:fullstack
      - name: Upload full-stack Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fullstack-report
          path: |
            frontend/playwright-report-fullstack
            frontend/test-results-fullstack
          if-no-files-found: ignore
          retention-days: 14

  disaster-recovery:
    name: Disaster recovery rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DR scripts
        run: |
          bash -n deploy/ops/backup.sh
          bash -n deploy/ops/restore.sh
          bash -n deploy/dr/smoke-test.sh
      - name: Rehearse backup and restore
        run: bash deploy/dr/smoke-test.sh

  containers:
    name: Production containers
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile, frontend-e2e, fullstack-e2e, disaster-recovery]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - run: docker build -f backend/Dockerfile -t barbertrix-api:ci .
      - run: docker build -f frontend/Dockerfile -t barbertrix-web:ci .
