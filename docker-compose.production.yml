name: barberturn

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${BARBERTURN_DB_PASSWORD:?Set BARBERTURN_DB_PASSWORD}
    volumes:
      - barberturn-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    environment:
      BARBERTURN_DB_PASSWORD: ${BARBERTURN_DB_PASSWORD:?Set BARBERTURN_DB_PASSWORD}
      BARBERTURN_DB_APP_PASSWORD: ${BARBERTURN_DB_APP_PASSWORD:?Set BARBERTURN_DB_APP_PASSWORD}
      BARBERTURN_DB_MIGRATOR_PASSWORD: ${BARBERTURN_DB_MIGRATOR_PASSWORD:?Set BARBERTURN_DB_MIGRATOR_PASSWORD}
    volumes:
      - ./deploy/sql:/bootstrap:ro
    command: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BarberTurnDb;User Id=barberturn_migrator;Password=${BARBERTURN_DB_MIGRATOR_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: BarberTurn.Api
      Jwt__Audience: BarberTurn.Web
      Jwt__Key: ${BARBERTURN_JWT_KEY:?Set BARBERTURN_JWT_KEY}
      Database__ApplyMigrations: "true"
      Database__MigrationOnly: "true"
    depends_on:
      db-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BarberTurnDb;User Id=barberturn_app;Password=${BARBERTURN_DB_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: BarberTurn.Api
      Jwt__Audience: BarberTurn.Web
      Jwt__Key: ${BARBERTURN_JWT_KEY:?Set BARBERTURN_JWT_KEY}
      Database__ApplyMigrations: "false"
      Database__MigrationOnly: "false"
      Demo__Enabled: "false"
      Auth__RequireVerifiedEmail: "true"
      PasswordReset__FrontendBaseUrl: ${BARBERTURN_PUBLIC_ORIGIN:?Set BARBERTURN_PUBLIC_ORIGIN}
      Cors__AllowedOrigins__0: ${BARBERTURN_PUBLIC_ORIGIN}
      Email__Enabled: "true"
      Email__ExposeDevelopmentLinks: "false"
      Email__From: ${BARBERTURN_EMAIL_FROM}
      Email__Smtp__Host: ${BARBERTURN_SMTP_HOST}
      Email__Smtp__Port: ${BARBERTURN_SMTP_PORT:-587}
      Email__Smtp__Username: ${BARBERTURN_SMTP_USERNAME}
      Email__Smtp__Password: ${BARBERTURN_SMTP_PASSWORD}
      HumanVerification__Enabled: "true"
      HumanVerification__SecretKey: ${BARBERTURN_TURNSTILE_SECRET}
      PayPal__Sandbox: "false"
      PayPal__ClientId: ${BARBERTURN_PAYPAL_CLIENT_ID}
      PayPal__Secret: ${BARBERTURN_PAYPAL_SECRET}
      PayPal__WebhookId: ${BARBERTURN_PAYPAL_WEBHOOK_ID}
      PayPal__PlanIds__Pro: ${BARBERTURN_PAYPAL_PRO_PLAN_ID}
      PayPal__PlanIds__Business: ${BARBERTURN_PAYPAL_BUSINESS_PLAN_ID}
      Push__Enabled: "true"
      Push__AccessToken: ${BARBERTURN_EXPO_ACCESS_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  barberturn-sqlserver:
