name: Free plan refresh

on:
  push:
    branches: [feat/free-plan-three-barbers]
    paths:
      - .free-plan-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/free-plan-three-barbers
          fetch-depth: 0

      - name: Apply Free plan and BarberTrix documentation updates
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {actual}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Backend source of truth.
          replace_exact(
              'backend/src/BarberTurn.Infrastructure/Common/OperationalServices.cs',
              '            SubscriptionPlan.Free => 2,',
              '            SubscriptionPlan.Free => 3,'
          )

          # Backend contract test and explicit server-side enforcement test.
          test_path = Path('backend/tests/BarberTurn.Api.Tests/FreePlanEntitlementTests.cs')
          test_text = test_path.read_text(encoding='utf-8')
          if test_text.count('Assert.Equal(2, usage.BarberLimit);') != 1:
              raise SystemExit('Unexpected Free barber limit assertion count')
          test_text = test_text.replace('Assert.Equal(2, usage.BarberLimit);', 'Assert.Equal(3, usage.BarberLimit);')
          anchor = '''    [Fact]\n    public async Task FreeServiceLimitIsEnforcedServerSide()\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit('Could not locate Free service limit test anchor')
          barber_test = '''    [Fact]\n    public async Task FreeBarberLimitAllowsThreeActiveBarbersAndRejectsFourth()\n    {\n        using var client = CreateClient();\n        var auth = await RegisterOwnerAsync(client);\n        client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", auth.AccessToken);\n\n        for (var index = 1; index <= 3; index++)\n        {\n            var created = await client.PostAsJsonAsync("/api/queue/barbers", new { name = $"Barber {index}", chairNumber = index });\n            Assert.Equal(HttpStatusCode.Created, created.StatusCode);\n        }\n\n        var rejected = await client.PostAsJsonAsync("/api/queue/barbers", new { name = "Barber 4", chairNumber = 4 });\n        Assert.Equal(HttpStatusCode.BadRequest, rejected.StatusCode);\n    }\n\n'''
          test_text = test_text.replace(anchor, barber_test + anchor)
          test_path.write_text(test_text, encoding='utf-8')

          # Commercial plan documentation.
          plans_path = Path('docs/plans-and-entitlements.md')
          plans = plans_path.read_text(encoding='utf-8')
          if plans.count('| Active barbers | 2 | 5 | 10 | Unlimited |') != 1:
              raise SystemExit('Unexpected plan entitlement barber row')
          plans = plans.replace('| Active barbers | 2 | 5 | 10 | Unlimited |', '| Active barbers | 3 | 5 | 10 | Unlimited |')
          plans = plans.replace('BarberTurn', 'BarberTrix')
          plans_path.write_text(plans, encoding='utf-8')

          # Public pricing copy. Keep historical locale structure untouched; only update product copy and limit.
          home_path = Path('frontend/src/i18n/homeAuxCopy.ts')
          home = home_path.read_text(encoding='utf-8').replace('BarberTurn', 'BarberTrix')
          replacements = {
              'Hasta 2 barberos': 'Hasta 3 barberos',
              'Up to 2 barbers': 'Up to 3 barbers',
              'Até 2 barbeiros': 'Até 3 barbeiros',
              'Jusqu’à 2 barbiers': 'Jusqu’à 3 barbiers',
              'Bis zu 2 Barbiere': 'Bis zu 3 Barbiere',
              'Fino a 2 barbieri': 'Fino a 3 barbieri',
              'Tot 2 barbiers': 'Tot 3 barbiers',
              'Jiska 2 babè': 'Jiska 3 babè',
              '理容師2名まで': '理容師3名まで',
          }
          for old, new in replacements.items():
              if old not in home:
                  raise SystemExit(f'homeAuxCopy.ts missing expected pricing copy: {old}')
              home = home.replace(old, new)
          home_path.write_text(home, encoding='utf-8')

          east_path = Path('frontend/src/i18n/eastAsiaHomeAuxCopy.ts')
          east = east_path.read_text(encoding='utf-8').replace('BarberTurn', 'BarberTrix')
          for old, new in {
              '바버 최대 2명': '바버 최대 3명',
              '最多 2 位理发师': '最多 3 位理发师',
          }.items():
              if old not in east:
                  raise SystemExit(f'eastAsiaHomeAuxCopy.ts missing expected pricing copy: {old}')
              east = east.replace(old, new)
          east_path.write_text(east, encoding='utf-8')

          # Visible product branding in the public home; lowercase asset paths intentionally remain legacy.
          page_path = Path('frontend/src/HomePage.tsx')
          page = page_path.read_text(encoding='utf-8')
          if 'BarberTurn' not in page:
              raise SystemExit('HomePage.tsx had no legacy visible BarberTurn copy to migrate')
          page_path.write_text(page.replace('BarberTurn', 'BarberTrix'), encoding='utf-8')

          # README plan value + detailed stack badges.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          if readme.count('| Barberos activos | 2 | 5 | 10 | Ilimitados |') != 1:
              raise SystemExit('Unexpected README Free barber row')
          readme = readme.replace('| Barberos activos | 2 | 5 | 10 | Ilimitados |', '| Barberos activos | **3** | 5 | 10 | Ilimitados |')

          badge_blocks = {
              '### 🟣 Backend\n\n': '''### 🟣 Backend\n\n<p align="left">\n  <img src="https://skillicons.dev/icons?i=dotnet&theme=dark" height="48" alt=".NET" />\n  <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/csharp/csharp-original.svg" height="48" alt="C#" />\n</p>\n\n<p align="left">\n  <img src="https://img.shields.io/badge/.NET-10-512BD4?style=flat-square&logo=dotnet&logoColor=white" alt=".NET 10" />\n  <img src="https://img.shields.io/badge/ASP.NET_Core-Web_API-512BD4?style=flat-square&logo=dotnet&logoColor=white" alt="ASP.NET Core Web API" />\n  <img src="https://img.shields.io/badge/Entity_Framework_Core-ORM-512BD4?style=flat-square&logo=dotnet&logoColor=white" alt="Entity Framework Core" />\n  <img src="https://img.shields.io/badge/JWT-Refresh_Rotation-111827?style=flat-square&logo=jsonwebtokens&logoColor=white" alt="JWT con refresh rotation" />\n  <img src="https://img.shields.io/badge/SignalR-Realtime-512BD4?style=flat-square&logo=dotnet&logoColor=white" alt="SignalR" />\n  <img src="https://img.shields.io/badge/OpenAPI-Development-6BA539?style=flat-square&logo=openapiinitiative&logoColor=white" alt="OpenAPI" />\n  <img src="https://img.shields.io/badge/PayPal-REST_API-003087?style=flat-square&logo=paypal&logoColor=white" alt="PayPal REST API" />\n</p>\n\n''',
              '### 🔵 Frontend web\n\n': '''### 🔵 Frontend web\n\n<p align="left">\n  <img src="https://skillicons.dev/icons?i=react,ts,vite,html,css&theme=dark" height="48" alt="React, TypeScript, Vite, HTML y CSS" />\n</p>\n\n<p align="left">\n  <img src="https://img.shields.io/badge/React-19-61DAFB?style=flat-square&logo=react&logoColor=111827" alt="React 19" />\n  <img src="https://img.shields.io/badge/React_Router-7.18.3-CA4245?style=flat-square&logo=reactrouter&logoColor=white" alt="React Router 7.18.3" />\n  <img src="https://img.shields.io/badge/TypeScript-5.9-3178C6?style=flat-square&logo=typescript&logoColor=white" alt="TypeScript 5.9" />\n  <img src="https://img.shields.io/badge/Vite-8-646CFF?style=flat-square&logo=vite&logoColor=white" alt="Vite 8" />\n  <img src="https://img.shields.io/badge/Font_Awesome-Icons-528DD7?style=flat-square&logo=fontawesome&logoColor=white" alt="Font Awesome" />\n  <img src="https://img.shields.io/badge/Vitest-4-6E9F18?style=flat-square&logo=vitest&logoColor=white" alt="Vitest 4" />\n  <img src="https://img.shields.io/badge/Playwright-1.62-2EAD33?style=flat-square&logo=playwright&logoColor=white" alt="Playwright 1.62" />\n</p>\n\n''',
              '### 📱 Mobile\n\n': '''### 📱 Mobile\n\n<p align="left">\n  <img src="https://img.shields.io/badge/React_Native-0.86.3-61DAFB?style=flat-square&logo=react&logoColor=111827" alt="React Native 0.86.3" />\n  <img src="https://img.shields.io/badge/Expo_SDK-57-000020?style=flat-square&logo=expo&logoColor=white" alt="Expo SDK 57" />\n  <img src="https://img.shields.io/badge/Expo_Router-57-000020?style=flat-square&logo=expo&logoColor=white" alt="Expo Router 57" />\n  <img src="https://img.shields.io/badge/TypeScript-6-3178C6?style=flat-square&logo=typescript&logoColor=white" alt="TypeScript 6" />\n  <img src="https://img.shields.io/badge/TanStack_Query-5-FF4154?style=flat-square&logo=reactquery&logoColor=white" alt="TanStack Query 5" />\n  <img src="https://img.shields.io/badge/SignalR-Realtime-512BD4?style=flat-square&logo=dotnet&logoColor=white" alt="SignalR" />\n  <img src="https://img.shields.io/badge/Expo_SecureStore-Secure_Session-000020?style=flat-square&logo=expo&logoColor=white" alt="Expo SecureStore" />\n  <img src="https://img.shields.io/badge/Expo_Notifications-Push-000020?style=flat-square&logo=expo&logoColor=white" alt="Expo Notifications" />\n</p>\n\n''',
              '### 🗄️ Datos e infraestructura\n\n': '''### 🗄️ Datos e infraestructura\n\n<p align="left">\n  <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/microsoftsqlserver/microsoftsqlserver-original.svg" height="48" alt="SQL Server" />\n  <img src="https://skillicons.dev/icons?i=docker,nginx,github&theme=dark" height="48" alt="Docker, Nginx y GitHub" />\n</p>\n\n<p align="left">\n  <img src="https://img.shields.io/badge/SQL_Server-2022-CC2927?style=flat-square&logo=microsoftsqlserver&logoColor=white" alt="SQL Server 2022" />\n  <img src="https://img.shields.io/badge/Docker_Compose-Orchestration-2496ED?style=flat-square&logo=docker&logoColor=white" alt="Docker Compose" />\n  <img src="https://img.shields.io/badge/Nginx-Frontend-009639?style=flat-square&logo=nginx&logoColor=white" alt="Nginx" />\n  <img src="https://img.shields.io/badge/Netlify-Frontend_Reference-00C7B7?style=flat-square&logo=netlify&logoColor=white" alt="Netlify" />\n  <img src="https://img.shields.io/badge/GitHub_Actions-CI-2088FF?style=flat-square&logo=githubactions&logoColor=white" alt="GitHub Actions" />\n  <img src="https://img.shields.io/badge/CodeQL-Security-181717?style=flat-square&logo=github&logoColor=white" alt="CodeQL" />\n  <img src="https://img.shields.io/badge/Gitleaks-Secret_Scan-6E40C9?style=flat-square&logo=github&logoColor=white" alt="Gitleaks" />\n</p>\n\n''',
          }
          if 'React_Native-0.86.3' in readme:
              raise SystemExit('Detailed stack badge blocks already present unexpectedly')
          for anchor_text, replacement in badge_blocks.items():
              if readme.count(anchor_text) != 1:
                  raise SystemExit(f'README anchor mismatch: {anchor_text!r}')
              readme = readme.replace(anchor_text, replacement)
          readme_path.write_text(readme, encoding='utf-8')

          # Guardrails: no stale Free=2 commercial copy in the files touched above.
          stale_checks = {
              'backend/src/BarberTurn.Infrastructure/Common/OperationalServices.cs': ['SubscriptionPlan.Free => 2,'],
              'backend/tests/BarberTurn.Api.Tests/FreePlanEntitlementTests.cs': ['Assert.Equal(2, usage.BarberLimit);'],
              'README.md': ['| Barberos activos | 2 |'],
              'docs/plans-and-entitlements.md': ['| Active barbers | 2 |'],
              'frontend/src/i18n/homeAuxCopy.ts': ['Hasta 2 barberos', 'Up to 2 barbers', 'Até 2 barbeiros', 'Jusqu’à 2 barbiers', 'Bis zu 2 Barbiere', 'Fino a 2 barbieri', 'Tot 2 barbiers', 'Jiska 2 babè', '理容師2名まで'],
              'frontend/src/i18n/eastAsiaHomeAuxCopy.ts': ['바버 최대 2명', '最多 2 位理发师'],
          }
          for filename, needles in stale_checks.items():
              contents = Path(filename).read_text(encoding='utf-8')
              for needle in needles:
                  if needle in contents:
                      raise SystemExit(f'Stale Free plan copy remains in {filename}: {needle}')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/plans-and-entitlements.md frontend/src/HomePage.tsx frontend/src/i18n/homeAuxCopy.ts frontend/src/i18n/eastAsiaHomeAuxCopy.ts backend/src/BarberTurn.Infrastructure/Common/OperationalServices.cs backend/tests/BarberTurn.Api.Tests/FreePlanEntitlementTests.cs
          git commit -m "feat(plans): allow three barbers on Free"
          git push origin HEAD:feat/free-plan-three-barbers
