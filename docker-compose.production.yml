name: barbertrix

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${BARBERTRIX_DB_PASSWORD:?Set BARBERTRIX_DB_PASSWORD}
    volumes:
      - barbertrix-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    environment:
      BARBERTRIX_DB_PASSWORD: ${BARBERTRIX_DB_PASSWORD:?Set BARBERTRIX_DB_PASSWORD}
      BARBERTRIX_DB_APP_PASSWORD: ${BARBERTRIX_DB_APP_PASSWORD:?Set BARBERTRIX_DB_APP_PASSWORD}
      BARBERTRIX_DB_MIGRATOR_PASSWORD: ${BARBERTRIX_DB_MIGRATOR_PASSWORD:?Set BARBERTRIX_DB_MIGRATOR_PASSWORD}
    volumes:
      - ./deploy/sql:/bootstrap:ro
    command: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BarberTrixDb;User Id=barbertrix_migrator;Password=${BARBERTRIX_DB_MIGRATOR_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: BarberTrix.Api
      Jwt__Audience: BarberTrix.Web
      Jwt__Key: ${BARBERTRIX_JWT_KEY:?Set BARBERTRIX_JWT_KEY}
      Database__ApplyMigrations: "true"
      Database__MigrationOnly: "true"
    depends_on:
      db-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BarberTrixDb;User Id=barbertrix_app;Password=${BARBERTRIX_DB_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: BarberTrix.Api
      Jwt__Audience: BarberTrix.Web
      Jwt__Key: ${BARBERTRIX_JWT_KEY:?Set BARBERTRIX_JWT_KEY}
      Database__ApplyMigrations: "false"
      Database__MigrationOnly: "false"
      Demo__Enabled: "false"
      Auth__RequireVerifiedEmail: "true"
      # Safe for this topology because the API is not published to the host;
      # requests reach it through the nginx web service only.
      ReverseProxy__TrustAnyProxy: "true"
      AllowedHosts: ${BARBERTRIX_ALLOWED_HOSTS:?Set BARBERTRIX_ALLOWED_HOSTS}
      PasswordReset__FrontendBaseUrl: ${BARBERTRIX_PUBLIC_ORIGIN:?Set BARBERTRIX_PUBLIC_ORIGIN}
      ExternalAuth__PublicBaseUrl: ${BARBERTRIX_EXTERNAL_AUTH_PUBLIC_BASE_URL:-}
      ExternalAuth__WebReturnUri: ${BARBERTRIX_PUBLIC_ORIGIN}/#/auth-callback
      ExternalAuth__Google__ClientId: ${BARBERTRIX_GOOGLE_CLIENT_ID:-}
      ExternalAuth__Google__ClientIds: ${BARBERTRIX_GOOGLE_CLIENT_ID:-}
      ExternalAuth__Google__ClientSecret: ${BARBERTRIX_GOOGLE_CLIENT_SECRET:-}
      ExternalAuth__Apple__ClientId: ${BARBERTRIX_APPLE_CLIENT_ID:-}
      ExternalAuth__Apple__ClientIds: ${BARBERTRIX_APPLE_CLIENT_ID:-}
      ExternalAuth__Apple__TeamId: ${BARBERTRIX_APPLE_TEAM_ID:-}
      ExternalAuth__Apple__KeyId: ${BARBERTRIX_APPLE_KEY_ID:-}
      ExternalAuth__Apple__PrivateKey: ${BARBERTRIX_APPLE_PRIVATE_KEY:-}
      Cors__AllowedOrigins__0: ${BARBERTRIX_PUBLIC_ORIGIN}
      Email__Enabled: "true"
      Email__ExposeDevelopmentLinks: "false"
      Email__From: ${BARBERTRIX_EMAIL_FROM:?Set BARBERTRIX_EMAIL_FROM}
      Email__Smtp__Host: ${BARBERTRIX_SMTP_HOST:?Set BARBERTRIX_SMTP_HOST}
      Email__Smtp__Port: ${BARBERTRIX_SMTP_PORT:-587}
      Email__Smtp__Username: ${BARBERTRIX_SMTP_USERNAME:?Set BARBERTRIX_SMTP_USERNAME}
      Email__Smtp__Password: ${BARBERTRIX_SMTP_PASSWORD:?Set BARBERTRIX_SMTP_PASSWORD}
      HumanVerification__Enabled: "true"
      HumanVerification__SecretKey: ${BARBERTRIX_TURNSTILE_SECRET:?Set BARBERTRIX_TURNSTILE_SECRET}
      PayPal__Sandbox: "false"
      PayPal__ClientId: ${BARBERTRIX_PAYPAL_CLIENT_ID:?Set BARBERTRIX_PAYPAL_CLIENT_ID}
      PayPal__Secret: ${BARBERTRIX_PAYPAL_SECRET:?Set BARBERTRIX_PAYPAL_SECRET}
      PayPal__WebhookId: ${BARBERTRIX_PAYPAL_WEBHOOK_ID:?Set BARBERTRIX_PAYPAL_WEBHOOK_ID}
      PayPal__PlanIds__Pro: ${BARBERTRIX_PAYPAL_PRO_PLAN_ID:?Set BARBERTRIX_PAYPAL_PRO_PLAN_ID}
      PayPal__PlanIds__Business: ${BARBERTRIX_PAYPAL_BUSINESS_PLAN_ID:?Set BARBERTRIX_PAYPAL_BUSINESS_PLAN_ID}
      ShopMedia__RootPath: /app/data/shop-media
      Push__Enabled: "true"
      Push__AccessToken: ${BARBERTRIX_EXPO_ACCESS_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - barbertrix-shop-media:/app/data/shop-media
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  barbertrix-sqlserver:
  barbertrix-shop-media:
