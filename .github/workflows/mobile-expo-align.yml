name: Mobile Expo alignment

on:
  push:
    branches:
      - quality/security-followup

permissions:
  contents: write

concurrency:
  group: mobile-expo-align-${{ github.ref }}
  cancel-in-progress: true

jobs:
  align:
    name: Align Expo SDK 57 dependencies
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/security-followup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install current lockfile
        run: npm ci
      - name: Align Expo-managed packages
        run: >-
          npx expo install
          expo-crypto@~57.0.3
          expo-dev-client@~57.0.19
          expo-image-manipulator@~57.0.21
          expo-image-picker@~57.0.20
          expo-location@~57.0.20
          expo-notifications@~57.0.22
          expo-secure-store@~57.0.4
      - name: Validate Expo alignment
        run: npx expo install --check
      - name: Validate no critical production advisories
        run: npm audit --omit=dev --audit-level=critical
      - name: Commit aligned manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo dependencies are already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(mobile): align Expo SDK 57 dependencies"
          git push origin HEAD:quality/security-followup
